<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <!--
    Apply the saved theme (or leave unset to follow system preference)
    BEFORE the stylesheet loads, to avoid a flash of the wrong theme.
    This must stay inline and synchronous (not deferred).
  -->
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>

  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- Lunr.js for client-side search -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>

  {% if site.analytics.cloudflare_token and site.analytics.cloudflare_token != "" %}
  <!-- Cloudflare Web Analytics — privacy-friendly, no cookies -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "{{ site.analytics.cloudflare_token }}"}'></script>
  {% endif %}
</head>
<body>
  {% include header.html %}

  <main class="wrapper">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
