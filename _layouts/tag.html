---
layout: default
---
<section class="archive">
  <header class="archive-header">
    <h1>#{{ page.title }}</h1>
    <p class="archive-count">{{ page.posts.size }} post{% if page.posts.size != 1 %}s{% endif %}</p>
  </header>

  <div class="post-list">
    {% for post in page.posts %}
      {% include post-card.html post=post %}
    {% endfor %}
  </div>
</section>
